[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ustc-campus-agent-hub"
version = "0.1.0"
description = "Campus Agent Hub control plane and gateway"
requires-python = ">=3.10"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "pyjwt[crypto]>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
campus-agent-hub = "hub.main:run"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
