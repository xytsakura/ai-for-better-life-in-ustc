<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Agent Hub</title>
    <meta
      name="description"
      content="面向校园场景的 Agent 应用广场、统一聊天、开发者接入和管理审核工作台。"
    />
    <script src="/hub-theme.js?v=20260808-1"></script>
    <script>
      document.documentElement.dataset.theme = globalThis.HubTheme.readFromGlobal();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=20260807-28" />
  </head>
  <body>
    <div class="splash" aria-hidden="true">
      <div class="splash__inner">
        <div class="splash__logo">
          <img src="/assets/ustc-emblem.jpg" alt="" />
        </div>
        <div class="splash__title">AI FOR USTCERS</div>
      </div>
    </div>

    <div id="app" class="hub-shell" data-route="portal">
      <aside class="hub-sidebar" aria-label="Hub 导航">
        <a class="brand" href="/hub" data-link>
          <span class="brand__mark"><img src="/assets/ustc-emblem.jpg" alt="" /></span>
          <span>
            <span class="brand__title">AI FOR USTCERS</span>
            <span class="brand__subtitle">Campus Agent Hub</span>
          </span>
        </a>

        <nav class="hub-nav">
          <a href="/hub" data-link data-nav="portal"><span aria-hidden="true">⌂</span>主页</a>
          <a href="/hub/agents" data-link data-nav="directory"><span aria-hidden="true">✦</span>Agent 广场</a>
          <a href="/hub/submit" data-link data-nav="submit"><span aria-hidden="true">＋</span>开发者接入</a>
          <a href="/hub/admin" data-link data-nav="admin" data-admin-only><span aria-hidden="true">◇</span>管理审核</a>
          <a href="/hub/settings" data-link data-nav="settings"><span aria-hidden="true">✎</span>模型配置</a>
        </nav>

        <div class="hub-sidebar__foot">
          <button id="themeToggle" class="ghost-button" type="button">切换主题</button>
          <span>Campus Agent Hub · Demo</span>
        </div>
      </aside>

      <div class="hub-main">
        <header class="hub-topbar">
          <button class="mobile-nav-toggle" type="button" aria-label="打开导航">☰</button>
          <label class="hub-search" aria-label="搜索 Agent">
            <span aria-hidden="true">⌕</span>
            <input id="globalSearch" type="search" placeholder="搜索 Agent、能力或维护者" autocomplete="off" />
          </label>
          <label class="identity-switcher">
            <span>身份</span>
            <select id="identitySelect"></select>
          </label>
          <span id="userNickname" class="user-nickname" aria-label="昵称"></span>
          <a id="userAvatar" class="user-avatar" href="/hub/profile" data-link aria-label="个人主页"></a>
        </header>

        <main id="view" class="hub-view" tabindex="-1"></main>
      </div>
    </div>

    <template id="skeletonCards">
      <div class="skeleton-grid" aria-label="正在加载">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </template>

    <script src="/splash.js?v=20260807-2" defer></script>
    <script type="module" src="/app.js?v=20260809-1"></script>
  </body>
</html>
