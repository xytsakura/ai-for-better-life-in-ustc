<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Agent Hub</title>
    <meta
      name="description"
      content="面向校园场景的 Agent 应用广场、统一聊天、开发者接入和管理审核工作台。"
    />
    <link rel="stylesheet" href="/styles.css?v=20260806-2" />
  </head>
  <body>
    <div class="splash" aria-hidden="true">
      <div class="splash__inner">
        <div class="splash__logo">
          <img src="/assets/ustc-emblem.jpg" alt="" />
        </div>
        <div class="splash__title">AI for better Life</div>
      </div>
    </div>

    <div id="app" class="hub-shell" data-route="portal">
      <aside class="hub-sidebar" aria-label="Hub 导航">
        <a class="brand" href="/hub" data-link>
          <span class="brand__mark">科</span>
          <span>
            <span class="brand__title">AI for better Life</span>
            <span class="brand__subtitle">Campus Agent Hub</span>
          </span>
        </a>

        <nav class="hub-nav">
          <a href="/hub" data-link data-nav="portal">Agent 广场</a>
          <a href="/hub/recent" data-link data-nav="recent">我的最近使用</a>
          <a href="/hub/submit" data-link data-nav="submit">开发者接入</a>
          <a href="/hub/admin" data-link data-nav="admin" data-admin-only>管理审核</a>
        </nav>

        <div class="hub-sidebar__foot">
          <button id="themeToggle" class="ghost-button" type="button">切换主题</button>
          <p>浏览器不会把任意目标 URL 传给 Gateway；所有调用由服务端 Registry 决定。</p>
        </div>
      </aside>

      <div class="hub-main">
        <header class="hub-topbar">
          <button class="mobile-nav-toggle" type="button" aria-label="打开导航">☰</button>
          <label class="hub-search" aria-label="搜索 Agent">
            <span>⌕</span>
            <input id="globalSearch" type="search" placeholder="搜索 Agent、能力或维护者" autocomplete="off" />
          </label>
          <label class="identity-switcher">
            <span>身份</span>
            <select id="identitySelect"></select>
          </label>
          <span id="userAvatar" class="user-avatar" aria-label="当前用户"></span>
        </header>

        <main id="view" class="hub-view" tabindex="-1"></main>
      </div>
    </div>

    <template id="skeletonCards">
      <div class="skeleton-grid" aria-label="正在加载">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </template>

    <script src="/splash.js?v=20260805-3" defer></script>
    <script type="module" src="/app.js?v=20260805-4"></script>
  </body>
</html>
