[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ustc-course-agent"
version = "0.8.0"
description = "数学分析 B1 课程资料整理与复习 Agent Demo"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "jieba>=0.42.1,<1",
  "pymupdf>=1.24,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
course-agent = "course_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
