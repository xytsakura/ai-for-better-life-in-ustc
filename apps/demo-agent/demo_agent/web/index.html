<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园助手 Demo Agent</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", sans-serif; color: #17211b; background: #f3f5f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); background: #fff; border: 1px solid #d8ded9; border-radius: 8px; padding: 36px; box-shadow: 0 14px 40px rgba(23, 33, 27, .08); }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; background: #1f6b45; color: #fff; border-radius: 8px; font-weight: 800; font-size: 20px; }
    h1 { margin: 22px 0 8px; font-size: clamp(28px, 7vw, 42px); line-height: 1.15; }
    p { color: #536159; line-height: 1.75; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 12px 20px; margin: 28px 0 0; padding-top: 24px; border-top: 1px solid #e5e9e6; }
    dt { color: #65736b; } dd { margin: 0; font-weight: 650; overflow-wrap: anywhere; }
    .status { color: #17643e; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">AI</div>
    <h1>校园助手 Demo Agent</h1>
    <p>这是一个与 Campus Agent Hub、瀚海行完全独立的示范服务，用来演示第三方应用如何从网址导航升级为平台内可对话的 Connected Agent。</p>
    <dl>
      <dt>服务状态</dt><dd class="status">运行中</dd>
      <dt>接入协议</dt><dd>Campus Agent Hub simple-chat v1</dd>
      <dt>演示能力</dt><dd>校园活动、通勤与自习信息入口</dd>
    </dl>
  </main>
</body>
</html>
