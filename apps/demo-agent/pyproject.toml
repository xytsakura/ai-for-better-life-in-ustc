[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ustc-campus-helper-demo-agent"
version = "1.1.0"
description = "Independent campus helper used to demonstrate Campus Agent Hub integration"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.9,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
campus-helper-demo = "demo_agent.main:run"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
demo_agent = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
